<!DOCTYPE html>
<html>
<head>
    <title>GeoLog Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { 
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="dashboard" style="
    position: absolute;
    top:10px;
    right: 10px;
    background: white;
    padding: 12px;
    border-radius: 10px;
    width:220px;
    box-shadow: 0 2px 10px rgb(0,0,0,0.2);
    z-index:1000;
">
    <h4 style="margin: 0 0 8px 0;">Stats</h4>

    <div>Total: <span id="total">0</span></div>
    <div>200 OK: <span id="ok">0</span></div>
    <div>500 Error: <span id="error">0</span></div>

    <canvas id="chart" width="200" height="150"></canvas>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script src="https://unpkg.com/leaflet-ant-path/dist/leaflet-ant-path.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const map = L.map('map').setView([-36.8485, 174.7633], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

    const NZ = [-36.8485, 174.7633]; // Auckland

    L.circleMarker(NZ, {
        color: 'yellow',
        radius: 10,
    })
    .addTo(map)
    .bindPopup("NZ Target");
    
    setInterval(() => {
       const glow = L.circleMarker(NZ, {
          color: 'yellow',
          radius: 15,
          opacity: 0.3
       }).addTo(map);

       setTimeout(() => {
          map.removeLayer(golw);
       }, 800);
    }, 1000);

    const heatData = [];

    const heat = L.heatLayer(heatData, {
        radius: 25,
        blur: 15,
        maxZoom: 10
    }).addTo(map);

    let total = 0;
    let okCount = 0;
    let errorCount = 0;

    const ctx = document.getElementById('chart');

    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['200 OK', '500 Error'],
            datasets: [{
                label: 'Requests',
                data: [0, 0]
            }]
        },
        options: {
            responsive: false,
            animation: false
        }
    });

    fetch('http://localhost:5033/api/logs')
        .then(res => res.json())
        .then(data => {
            data.forEach(log => {
                const color = log.statusCode >= 500 ? 'red' : 'green';

                console.log("marker:", log.lat, log.lng, color);

                L.circleMarker([log.lat, log.lng], {
                    color : color,
                    radius: 8
                })
                .addTo(map)
                .bindPopup(`${log.endpoint} (${log.statusCode})`);
            });
        });

    //SignalR realtime connection
    const connection = new signalR.HubConnectionBuilder()
        .withUrl("http://localhost:5033/logHub")
        .build();

    connection.on("ReceiveLog", function (log) {

        console.log("realtime data:", log);

        if(!log.lat || !log.lng || isNaN(log.lat) || isNaN(log.lng)){
            return;
        }

        //1. Animation stream
        if (log.statusCode >=500 && Math.random() <= 0.5) { 

            const path = L.polyline.antPath(
            [
                [log.lat, log.lng],
                NZ
            ],
            {
                delay: 400,
                dashArray: [10, 20],
                weight: 3,
                color: 'red',
                pulseColor: '#FFFFFF'
            }
            ).addTo(map);

            setTimeout(() => {
            map.removeLayer(path);
            }, 4000);
        }

        //2.Heatmap
        const weight = log.statusCode >= 500 ? 1.0 : 0.3;
        heatData.push([log.lat, log.lng, weight]);
        // heat.setInterval(heatData);

        if(heatData.length > 200) {
            heatData.shift();
        }

        heat.setLatLngs(heatData);

        //3.Marker
        const color = log.statusCode >= 500 ? 'red' : 'green';

        L.circleMarker([log.lat, log.lng], {
            color: color,
            radius: 10
        })
        .addTo(map)
        .bindPopup(`realtime: ${log.endpoint} (${log.statusCode})`);

       if(log.statusCode >=500 && Math.random() >0.7) {
          map.flyTo([log.lat, log.lng], 5, {
            duration: 1.5
          });
       } 

       total++;

       if (log.statusCode === 200) {
          okCount++;
       } else if (log.statusCode >= 500) {
           errorCount++;
       }

       document.getElementById("total").innerText = total;
       document.getElementById("ok").innerText = okCount;
       document.getElementById("error").innerText = errorCount;

       chart.data.datasets[0].data = [okCount, errorCount];
       chart.update();
    });

    connection.start()
        .then(() => {
            console.log("SignalR Connected");

            setInterval(() => {
                fetch('http://localhost:5033/api/logs');
            }, 3000);
        })
        .catch(err => console.error("SignalR Failed:", err));

</script>

</body>
</html>
